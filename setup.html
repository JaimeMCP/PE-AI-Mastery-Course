<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup — PE AI Mastery</title>
<style>
  body { background:#0e0e0e; color:#e8e4dc; font-family:system-ui,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:24px; box-sizing:border-box; }
  .card { background:#161616; border:1px solid #2e2e2e; border-radius:14px; padding:40px; width:100%; max-width:460px; }
  h1 { font-size:22px; margin-bottom:8px; }
  p { color:#9a9690; font-size:14px; margin-bottom:28px; line-height:1.6; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#5a5855; margin-bottom:6px; margin-top:16px; }
  input { width:100%; background:#1e1e1e; border:1px solid #3a3a3a; border-radius:8px; padding:11px 14px; color:#e8e4dc; font-size:14px; outline:none; box-sizing:border-box; }
  input:focus { border-color:#c9a84c; }
  button { width:100%; margin-top:24px; background:#c9a84c; color:#0e0e0e; border:none; border-radius:8px; padding:12px; font-size:14px; font-weight:500; cursor:pointer; }
  button:hover { background:#e8c97a; }
  .msg { margin-top:16px; padding:10px 14px; border-radius:8px; font-size:13px; display:none; }
  .ok { background:rgba(74,158,110,0.1); border:1px solid rgba(74,158,110,0.3); color:#6dba91; }
  .err { background:rgba(194,90,90,0.1); border:1px solid rgba(194,90,90,0.3); color:#e08080; }
  .current { background:#1e1e1e; border-radius:8px; padding:12px 14px; font-size:12px; color:#5a5855; margin-bottom:20px; word-break:break-all; line-height:1.6; }
  .current span { color:#9a9690; }
</style>
</head>
<body>
<div class="card">
  <h1>Configuración de Supabase</h1>
  <p>Introduce tus credenciales de Supabase. Solo necesitas hacerlo una vez en este navegador.</p>

  <div class="current" id="current-config"></div>

  <label>Supabase Project URL</label>
  <input type="text" id="url" placeholder="https://xxxx.supabase.co" />

  <label>Supabase Anon Key</label>
  <input type="text" id="key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." />

  <button onclick="save()">Guardar y abrir el curso</button>

  <div class="msg ok" id="msg-ok">✓ Guardado. Redirigiendo al curso...</div>
  <div class="msg err" id="msg-err"></div>
</div>

<script>
  const urlEl = document.getElementById('url');
  const keyEl = document.getElementById('key');
  const currentEl = document.getElementById('current-config');

  const savedUrl = localStorage.getItem('sb_url');
  const savedKey = localStorage.getItem('sb_key');

  if (savedUrl || savedKey) {
    currentEl.innerHTML = `<span>Configuración actual:</span><br>URL: ${savedUrl || '—'}<br>Key: ${savedKey ? savedKey.slice(0,30) + '...' : '—'}`;
    if (savedUrl) urlEl.value = savedUrl;
  } else {
    currentEl.textContent = 'No hay configuración guardada todavía.';
  }

  function save() {
    const url = urlEl.value.trim();
    const key = keyEl.value.trim();

    if (!url || !key) {
      const err = document.getElementById('msg-err');
      err.textContent = 'Introduce los dos campos.';
      err.style.display = 'block';
      return;
    }
    if (!url.startsWith('https://') || !url.includes('.supabase.co')) {
      const err = document.getElementById('msg-err');
      err.textContent = 'La URL debe ser https://xxxx.supabase.co';
      err.style.display = 'block';
      return;
    }

    localStorage.setItem('sb_url', url);
    localStorage.setItem('sb_key', key);

    document.getElementById('msg-ok').style.display = 'block';
    document.getElementById('msg-err').style.display = 'none';

    setTimeout(() => {
      window.location.href = 'index.html';
    }, 1500);
  }
</script>
</body>
</html>
