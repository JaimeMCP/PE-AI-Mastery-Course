<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PE AI Mastery</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0e0e0e; --bg2: #161616; --bg3: #1e1e1e; --bg4: #262626;
  --border: #2e2e2e; --border2: #3a3a3a;
  --text: #e8e4dc; --text2: #9a9690; --text3: #5a5855;
  --gold: #c9a84c; --gold2: #e8c97a; --gold-dim: rgba(201,168,76,0.12);
  --green: #4a9e6e; --green-dim: rgba(74,158,110,0.12);
  --red: #c25a5a; --purple: #9380d4;
  --radius: 8px; --radius-lg: 14px;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;
}
html.light {
  --bg: #f8f7f4; --bg2: #ffffff; --bg3: #f0ede8; --bg4: #e8e4de;
  --border: #ddd9d2; --border2: #c8c3ba;
  --text: #1a1917; --text2: #5a5754; --text3: #9a9590;
  --gold: #8a6d1e; --gold2: #a07d22; --gold-dim: rgba(138,109,30,0.10);
  --green: #2d7a50; --green-dim: rgba(45,122,80,0.10);
  --red: #a03030; --purple: #5a4aa0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;min-height:100vh;}

/* ── LOADING ── */
.loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .3s;}
.loading-logo{font-family:var(--font-display);font-size:18px;color:var(--gold);letter-spacing:.1em;}

/* ── AUTH ── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
#auth-screen{position:fixed;inset:0;z-index:1000;background:var(--bg);overflow-y:auto;}
.auth-card{width:100%;max-width:400px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px;}
.auth-logo{font-family:var(--font-display);font-size:11px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:28px;}
.auth-card h1{font-family:var(--font-display);font-size:24px;font-weight:600;margin-bottom:6px;}
.auth-card p{color:var(--text2);font-size:14px;margin-bottom:28px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
.field input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 13px;color:var(--text);font-family:var(--font-body);font-size:14px;outline:none;transition:border-color .15s;}
.field input:focus{border-color:var(--gold);}
.field input::placeholder{color:var(--text3);}
.btn-primary{width:100%;background:var(--gold);color:#0e0e0e;border:none;border-radius:var(--radius);padding:11px;font-family:var(--font-body);font-size:14px;font-weight:500;cursor:pointer;transition:background .15s;margin-top:6px;}
.btn-primary:hover{background:var(--gold2);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.auth-toggle{text-align:center;margin-top:16px;font-size:13px;color:var(--text2);}
.auth-toggle a{color:var(--gold);cursor:pointer;}
.auth-err{background:rgba(194,90,90,0.1);border:1px solid rgba(194,90,90,0.3);border-radius:var(--radius);padding:9px 13px;font-size:13px;color:#e08080;margin-bottom:14px;display:none;}
.hidden{display:none!important;}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh;}
.sidebar{width:248px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;}
.main{margin-left:248px;flex:1;padding:40px 48px;max-width:900px;}
@media(max-width:768px){.sidebar{transform:translateX(-100%);transition:transform .25s;}.sidebar.open{transform:translateX(0);}.main{margin-left:0;padding:20px 16px 80px;}.mob-bar{display:flex!important;}}

/* ── SIDEBAR ── */
.sb-head{padding:20px 16px;border-bottom:1px solid var(--border);}
.sb-logo{font-family:var(--font-display);font-size:11px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:14px;}
.sb-user{display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:20px;padding:5px 10px;}
.sb-avatar{width:20px;height:20px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--gold);color:var(--gold);font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-name{flex:1;font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-actions{display:flex;gap:4px;}
.theme-btn{background:none;border:1px solid var(--border2);border-radius:12px;padding:2px 8px;cursor:pointer;color:var(--text2);font-size:11px;font-family:var(--font-body);transition:all .15s;}
.theme-btn:hover{border-color:var(--gold);color:var(--gold);}
.logout-btn{background:none;border:1px solid var(--border2);border-radius:12px;padding:2px 8px;cursor:pointer;color:var(--text2);font-size:11px;font-family:var(--font-body);transition:all .15s;}
.logout-btn:hover{border-color:var(--red);color:var(--red);}

/* Global progress */
.sb-prog{padding:12px 16px;border-bottom:1px solid var(--border);}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:5px;}
.prog-bar{height:3px;background:var(--bg4);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .4s;}

/* Nav sections */
.sb-section{padding:8px 0;}
.sb-section-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding:6px 16px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;transition:background .1s;border-left:2px solid transparent;}
.nav-item:hover{background:var(--bg3);}
.nav-item.active{background:var(--gold-dim);border-left-color:var(--gold);}
.nav-item-icon{font-size:14px;flex-shrink:0;width:18px;text-align:center;}
.nav-item-text{flex:1;min-width:0;}
.nav-item-title{font-size:13px;color:var(--text);}
.nav-item-sub{font-size:10px;color:var(--text3);margin-top:1px;}
.nav-item-done{font-size:10px;color:var(--green);}

/* Phase progress ring */
.phase-ring{position:relative;width:28px;height:28px;flex-shrink:0;}
.phase-ring svg{transform:rotate(-90deg);}
.phase-ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;}

/* ── CONTENT ── */
/* Phase header */
.phase-hdr{margin-bottom:28px;}
.phase-tag{display:inline-block;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:10px;}
.phase-hdr h1{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.2;margin-bottom:6px;}
.phase-hdr p{color:var(--text2);font-size:14px;max-width:520px;}
.phase-stats{display:flex;gap:16px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap;}
.phase-stat{font-size:13px;color:var(--text2);}
.phase-stat strong{color:var(--text);font-weight:500;}

/* Doc picker */
.doc-picker{background:var(--bg2);border:1px solid rgba(201,168,76,0.35);border-radius:var(--radius-lg);padding:14px 18px;margin-bottom:24px;}
.doc-picker-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.doc-picker-title{font-size:13px;font-weight:500;color:var(--text);}
.doc-picker-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.doc-opts{display:flex;flex-direction:column;gap:5px;}
.doc-opt{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s;}
.doc-opt:hover{border-color:var(--border2);}
.doc-opt.sel{border-color:var(--gold);background:var(--gold-dim);}
.doc-opt-name{font-size:13px;font-weight:500;color:var(--text);flex:1;}
.doc-opt-type{font-size:10px;color:var(--text3);margin-top:1px;}
.doc-check{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.doc-opt.sel .doc-check{background:var(--gold);border-color:var(--gold);}
.doc-upload-lbl{display:flex;align-items:center;gap:8px;padding:9px 11px;background:none;border:1px dashed var(--border2);border-radius:var(--radius);cursor:pointer;font-family:var(--font-body);font-size:13px;color:var(--text3);transition:all .15s;margin-top:3px;}
.doc-upload-lbl:hover{border-color:var(--gold);color:var(--gold);}
.doc-active-bar{display:flex;align-items:center;gap:8px;font-size:12px;}
.doc-active-name{color:var(--gold);font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.doc-change{background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;font-family:var(--font-body);flex-shrink:0;}
.doc-change:hover{color:var(--text);}
.doc-expanded-opts{margin-top:10px;display:flex;flex-direction:column;gap:5px;}

/* Skill card */
.skill-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;transition:border-color .15s;}
.skill-card.done{border-color:rgba(74,158,110,0.3);}
.skill-hdr{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;user-select:none;}
.skill-hdr:hover{background:var(--bg3);}
.skill-check{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.skill-card.done .skill-check{background:var(--green);border-color:var(--green);}
.skill-title{font-size:15px;font-weight:500;flex:1;}
.skill-card.done .skill-title{text-decoration:line-through;color:var(--text3);}
.skill-chevron{color:var(--text3);transition:transform .2s;flex-shrink:0;}
.skill-card.open .skill-chevron{transform:rotate(180deg);}
.skill-body{display:none;border-top:1px solid var(--border);}
.skill-card.open .skill-body{display:block;}

/* Skill sections */
.skill-section{padding:18px 18px 0;}
.skill-section:last-child{padding-bottom:18px;}
.skill-section-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.skill-section-label::after{content:'';flex:1;height:1px;background:var(--border);}
.concept-text{font-size:14px;color:var(--text2);line-height:1.75;white-space:pre-wrap;}
.concept-text strong{color:var(--text);font-weight:500;}

/* Diagram */
.diagram-wrap{background:var(--bg4);border:1px solid var(--border);border-radius:var(--radius);padding:14px;overflow-x:auto;margin-top:12px;}

/* Try prompt */
.try-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.try-label{font-size:12px;font-weight:500;color:var(--purple);margin-bottom:8px;}
.try-q{font-size:13px;color:var(--text);margin-bottom:10px;line-height:1.5;}
.try-textarea{width:100%;min-height:90px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 12px;color:var(--text);font-family:var(--font-body);font-size:13px;line-height:1.6;resize:vertical;outline:none;}
.try-textarea:focus{border-color:var(--purple);}
.try-textarea::placeholder{color:var(--text3);}
.try-actions{display:flex;gap:8px;margin-top:8px;align-items:center;}
.show-ref-btn{background:var(--gold-dim);border:1px solid var(--gold);border-radius:var(--radius);padding:7px 14px;color:var(--gold);font-family:var(--font-body);font-size:12px;cursor:pointer;transition:all .15s;}
.show-ref-btn:hover{background:rgba(201,168,76,0.2);}
.try-hint{font-size:11px;color:var(--text3);}

/* Reference prompt */
.ref-box{display:none;margin-top:12px;}
.ref-box.visible{display:block;}
.ref-label{font-size:12px;font-weight:500;color:var(--gold);margin-bottom:8px;}
.ref-prompt{font-family:var(--font-mono);font-size:12px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--radius);padding:12px;color:var(--text2);white-space:pre-wrap;word-break:break-word;line-height:1.6;position:relative;}
.copy-ref{position:absolute;top:8px;right:8px;background:var(--bg2);border:1px solid var(--border2);border-radius:5px;padding:3px 9px;font-size:11px;cursor:pointer;color:var(--text2);font-family:var(--font-body);transition:all .15s;}
.copy-ref:hover{border-color:var(--gold);color:var(--gold);}
.gap-box{background:var(--bg3);border-left:3px solid var(--gold);border-radius:0 var(--radius) var(--radius) 0;padding:12px 14px;margin-top:10px;}
.gap-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:5px;}
.gap-text{font-size:13px;color:var(--text2);line-height:1.6;}

/* Open in Claude */
.open-claude-btn{background:none;border:1px solid var(--border2);border-radius:var(--radius);padding:7px 14px;color:var(--text2);font-family:var(--font-body);font-size:12px;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-block;}
.open-claude-btn:hover{border-color:var(--text2);color:var(--text);}

/* Mark done */
.mark-done-btn{display:block;width:100%;margin-top:14px;background:var(--green-dim);border:1px solid var(--green);border-radius:var(--radius);padding:9px;color:var(--green);font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;}
.mark-done-btn:hover{background:rgba(74,158,110,0.2);}
.skill-card.done .mark-done-btn{background:var(--bg3);border-color:var(--border2);color:var(--text3);}

/* ── LIBRARY ── */
.lib-search{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 13px;color:var(--text);font-family:var(--font-body);font-size:14px;outline:none;margin-bottom:20px;}
.lib-search:focus{border-color:var(--gold);}
.lib-category{margin-bottom:24px;}
.lib-cat-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.lib-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:8px;overflow:hidden;}
.lib-item-hdr{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;transition:background .1s;}
.lib-item-hdr:hover{background:var(--bg3);}
.lib-item-title{font-size:14px;font-weight:500;flex:1;}
.lib-tags{display:flex;gap:5px;flex-wrap:wrap;}
.lib-tag{font-size:10px;padding:2px 7px;border-radius:8px;background:var(--bg4);color:var(--text3);}
.lib-item-body{display:none;border-top:1px solid var(--border);padding:14px 16px;}
.lib-item.open .lib-item-body{display:block;}
.lib-prompt-box{font-family:var(--font-mono);font-size:12px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--radius);padding:12px;color:var(--text2);white-space:pre-wrap;word-break:break-word;line-height:1.6;position:relative;}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:11px 15px;font-size:13px;color:var(--text);z-index:9999;transform:translateY(60px);opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{border-color:var(--green);color:var(--green);}
.toast.error{border-color:var(--red);color:#e08080;}

/* ── MOBILE NAV ── */
.mob-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);z-index:200;padding:8px 0 12px;}
.mob-bar-inner{display:flex;justify-content:space-around;}
.mob-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 14px;cursor:pointer;background:none;border:none;color:var(--text3);font-family:var(--font-body);font-size:10px;transition:color .15s;}
.mob-btn.active{color:var(--gold);}

/* Sidebar overlay */
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;}
.sb-overlay.visible{display:block;}
.mob-hamburger{display:none;position:fixed;top:12px;left:12px;z-index:300;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:7px;cursor:pointer;color:var(--text2);}
@media(max-width:768px){.mob-hamburger{display:block;}}

  /* ── STREAK ── */
  .streak-bar{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .streak-fire{font-size:16px;}
  .streak-num{font-size:18px;font-weight:600;color:var(--gold);}
  .streak-label{font-size:10px;color:var(--text3);}
  .streak-dots{display:flex;gap:3px;margin-top:3px;}
  .streak-dot{width:7px;height:7px;border-radius:50%;background:var(--bg4);}
  .streak-dot.on{background:var(--gold);}
  .badge-btn{margin-left:auto;background:none;border:none;cursor:pointer;font-size:16px;padding:2px;}
  /* ── WEEKLY CHALLENGE ── */
  .weekly{background:var(--bg3);border:1px solid rgba(201,168,76,0.25);border-radius:var(--radius);padding:9px 12px;margin:0 12px 8px;cursor:pointer;transition:border-color .15s;}
  .weekly:hover{border-color:var(--gold);}
  .weekly-tag{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:500;margin-bottom:2px;}
  .weekly-title{font-size:12px;color:var(--text);line-height:1.3;}
  .weekly-status{font-size:10px;margin-top:2px;}
  /* ── BADGES MODAL ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:460px;max-height:80vh;overflow-y:auto;}
  .modal-hdr{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .modal-hdr-title{font-family:var(--font-display);font-size:17px;font-weight:600;}
  .modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:17px;padding:3px;}
  .modal-close:hover{color:var(--text);}
  .modal-body{padding:18px;}
  .badges-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .badge-card{text-align:center;padding:14px 8px;background:var(--bg3);border-radius:var(--radius);border:1px solid var(--border);}
  .badge-card.earned{border-color:rgba(201,168,76,0.4);background:var(--gold-dim);}
  .badge-card.locked{opacity:.35;filter:grayscale(1);}
  .badge-emoji{font-size:26px;margin-bottom:5px;}
  .badge-name{font-size:11px;font-weight:500;color:var(--text);}
  .badge-desc{font-size:10px;color:var(--text3);margin-top:2px;line-height:1.3;}
  .badge-earned-lbl{font-size:9px;color:var(--gold);margin-top:3px;font-weight:500;}
  /* ── LEADERBOARD ── */
  .lb-wrap{padding:0;}
  .lb-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:14px;}
  .lb-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .lb-hdr-title{font-family:var(--font-display);font-size:15px;font-weight:600;}
  .lb-hdr-sub{font-size:11px;color:var(--text3);}
  .lb-row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border);transition:background .1s;}
  .lb-row:last-child{border-bottom:none;}
  .lb-row:hover{background:var(--bg3);}
  .lb-rank{font-family:var(--font-mono);font-size:12px;color:var(--text3);width:22px;text-align:center;flex-shrink:0;}
  .lb-rank.r1{color:var(--gold);font-weight:600;}
  .lb-rank.r2{color:#9a9690;font-weight:600;}
  .lb-rank.r3{color:#8b6914;font-weight:600;}
  .lb-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
  .lb-info{flex:1;min-width:0;}
  .lb-name{font-size:13px;font-weight:500;}

// STREAK
function getStreak() {
  var log = JSON.parse(localStorage.getItem('activity_log')||'[]');
  if(!log.length) return 0;
  var today = new Date().toISOString().slice(0,10);
  var yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(!log.includes(today) && !log.includes(yesterday)) return 0;
  var streak = 0;
  var d = new Date();
  if(!log.includes(today)) d = new Date(Date.now()-86400000);
  while(true) {
    var ds = d.toISOString().slice(0,10);
    if(!log.includes(ds)) break;
    streak++;
    d = new Date(d.getTime()-86400000);
  }
  return streak;
}

function recordActivity() {
  var today = new Date().toISOString().slice(0,10);
  var log = JSON.parse(localStorage.getItem('activity_log')||'[]');
  if(!log.includes(today)) { log.push(today); if(log.length>90) log.splice(0,log.length-90); localStorage.setItem('activity_log',JSON.stringify(log)); }
}

function renderStreak() {
  var streak = getStreak();
  var el = document.getElementById('streak-num'); if(el) el.textContent = streak;
  var dotsEl = document.getElementById('streak-dots');
  if(dotsEl) {
    var log = JSON.parse(localStorage.getItem('activity_log')||'[]');
    dotsEl.innerHTML = Array.from({length:7},function(_,i){
      var d = new Date(Date.now()-(6-i)*86400000).toISOString().slice(0,10);
      return '<div class="streak-dot'+(log.includes(d)?' on':'')+'"></div>';
    }).join('');
  }
}

    var userMap = {};
    (res.data||[]).forEach(function(r) {
      if(!userMap[r.user_id]) userMap[r.user_id]={skills:new Set()};
      if(r.completed) userMap[r.user_id].skills.add(r.skill_id);
    });
    var total = PHASES.flatMap(function(p){return p.skills;}).length;
    var entries = Object.entries(userMap).map(function(e) {
      return {uid:e[0], done:e[1].skills.size, pct:Math.round(e[1].skills.size/total*100), isMe:e[0]===currentUser.id};
    }).sort(function(a,b){return b.done-a.done;});

    var me = entries.find(function(e){return e.isMe;})||{done:0,pct:0};
    var myRank = entries.findIndex(function(e){return e.isMe;})+1;
    var nextPerson = entries[myRank-2];
    var icons = ['🥇','🥈','🥉'];

    var statsHtml = '<div class="my-stats">'
      +'<div class="my-stat"><div class="my-stat-num" style="color:var(--gold)">'+myRank+'º</div><div class="my-stat-lbl">Posición</div></div>'
      +'<div class="my-stat"><div class="my-stat-num">'+me.done+'</div><div class="my-stat-lbl">Habilidades</div></div>'
      +'<div class="my-stat"><div class="my-stat-num" style="color:var(--green)">'+me.pct+'%</div><div class="my-stat-lbl">Completado</div></div>'
      +'</div>';

    var gapHtml = '';
    if(nextPerson && !nextPerson.isMe) gapHtml = '<div style="padding:10px 18px;font-size:12px;color:var(--text3);border-top:1px solid var(--border)">Te separan <strong style="color:var(--text)">'+(nextPerson.done-me.done)+' habilidades</strong> del puesto anterior.</div>';
    else if(myRank===1) gapHtml = '<div style="padding:10px 18px;font-size:12px;color:var(--gold);border-top:1px solid var(--border)">🥇 Eres el líder del equipo.</div>';

    var rowsHtml = entries.map(function(e,i) {
      var col = LB_COLORS[i%LB_COLORS.length];
      var label = e.isMe ? 'Tú' : 'Usuario '+(i+1);
      var rankCls = i<3?'r'+(i+1):'';
      return '<div class="lb-row"><div class="lb-rank '+rankCls+'">'+(i<3?icons[i]:i+1)+'</div>'
        +'<div class="lb-avatar" style="background:'+col.bg+';color:'+col.color+'">'+label.slice(0,2).toUpperCase()+'</div>'
        +'<div class="lb-info"><div class="lb-name">'+label+(e.isMe?'<span class="lb-you">Tú</span>':'')+'</div>'
        +'<div class="lb-detail">'+e.done+' habilidades completadas</div></div>'
        +'<div class="lb-bar-wrap"><div class="lb-bar-bg"><div class="lb-bar-fg" style="width:'+e.pct+'%"></div></div>'
        +'<div class="lb-pct">'+e.done+'/'+total+'</div></div></div>';
    }).join('');

    document.getElementById('lb-content').innerHTML = statsHtml
      +'<div class="lb-card">'+gapHtml+'</div>'
      +'<div class="lb-card"><div class="lb-hdr"><div><div class="lb-hdr-title">Ranking</div><div class="lb-hdr-sub">'+entries.length+' miembro'+(entries.length!==1?'s':'')+' activo'+(entries.length!==1?'s':'')+'</div></div></div>'+rowsHtml+'</div>';
  } catch(e) {
    document.getElementById('lb-content').innerHTML = '<div style="color:var(--red);font-size:13px;">Error: '+e.message+'</div>';
  }
}

function renderBeforeAfter(skillId) {
  const data = BEFORE_AFTER[skillId];
  if (!data) return '';
  return `<div class="dynamics-section ba-section">
    <div class="dynamics-label">👁 ${data.label}</div>
    <div class="ba-intro">${data.intro}</div>
    <div class="ba-grid">
      <div class="ba-card ba-bad">
        <div class="ba-card-label bad">✗ ${data.before.label}</div>
        <div class="ba-prompt-box">${data.before.prompt}</div>
        <div class="ba-output">${data.before.output}</div>
        <div class="ba-issues">
          ${data.before.problems.map(p=>`<div class="ba-issue bad-issue">✗ ${p}</div>`).join('')}
        </div>
      </div>
      <div class="ba-card ba-good">
        <div class="ba-card-label good">✓ ${data.after.label}</div>
        <div class="ba-prompt-box">${data.after.prompt}</div>
        <div class="ba-output">${data.after.output}</div>
        <div class="ba-issues">
          ${data.after.improvements.map(p=>`<div class="ba-issue good-issue">✓ ${p}</div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function renderScaffolding(skillId) {
  const data = SCAFFOLDING[skillId];
  if (!data) return '';
  return `<div class="dynamics-section sc-section">
    <div class="dynamics-label">🧱 ${data.label}</div>
    <div class="sc-steps">
      ${data.steps.map(s => `
        <div class="sc-step">
          <div class="sc-step-num">${s.step}</div>
          <div class="sc-step-body">
            <div class="sc-step-title">${s.title}</div>
            <div class="sc-step-desc">${s.desc}</div>
            <div class="sc-step-detail">${s.detail}</div>
            ${s.code ? `<div class="sc-code">${s.code}</div>` : ''}
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

function renderFindTheError(skillId) {
  const data = FIND_THE_ERROR[skillId];
  if (!data) return '';
  const storageKey = `fte_revealed_${skillId}`;
  const revealed = localStorage.getItem(storageKey) === 'true';
  return `<div class="dynamics-section fte-section" id="fte-${skillId}">
    <div class="dynamics-label">🔍 ${data.label}</div>
    <div class="fte-intro">${data.intro}</div>
    <div class="fte-output">${data.flawed_output}</div>

// QUIZ ENGINE
// ═══════════════════════════════════════════════

function getQuizState(phaseId) {
  try { return JSON.parse(localStorage.getItem('quiz_' + phaseId) || 'null'); } catch(e) { return null; }
}
function saveQuizState(phaseId, state) {
  localStorage.setItem('quiz_' + phaseId, JSON.stringify(state));
}

function renderQuizSection(phaseId) {
  const quiz = QUIZZES[phaseId];
  if (!quiz) return '';
  const state = getQuizState(phaseId);
  const completed = state && state.completed;
  const score = state ? state.score : null;
  const total = quiz.questions.filter(q => q.type !== 'reflection').length;

  return '<div class="quiz-section" id="quiz-' + phaseId + '">'
    + '<div class="quiz-header" onclick="toggleQuiz(\'' + phaseId + '\')">'
    + '<div class="quiz-header-left">'
    + '<span class="quiz-icon">' + (completed ? '✓' : '📝') + '</span>'
    + '<div>'
    + '<div class="quiz-title">' + quiz.title + '</div>'
    + '<div class="quiz-subtitle">' + (completed ? 'Completado · ' + score + '/' + total + ' correctas' : '5 preguntas · 4 de juicio + 1 reflexión abierta') + '</div>'
    + '</div>'
    + '</div>'
    + '<div class="quiz-toggle-btn" id="quiz-toggle-' + phaseId + '">Comenzar →</div>'
    + '</div>'
    + '<div class="quiz-body" id="quiz-body-' + phaseId + '" style="display:none">'
    + renderQuizBody(phaseId, state)
    + '</div>'
    + '</div>';
}

function renderQuizBody(phaseId, state) {
  const quiz = QUIZZES[phaseId];
  if (!quiz) return '';
  let html = '';
  quiz.questions.forEach(function(q, i) {
    const answered = state && state.answers && state.answers[i] !== undefined;
    const userAnswer = state && state.answers ? state.answers[i] : null;
    html += renderQuestion(phaseId, q, i, answered, userAnswer);
  });
  if (!state || !state.completed) {
    html += '<button class="quiz-submit-btn" onclick="submitQuiz(\'' + phaseId + '\')">Ver resultados</button>';
  }
  return html;
}

function renderQuestion(phaseId, q, idx, answered, userAnswer) {
  if (q.type === 'reflection') {
    return renderReflection(phaseId, q, idx, answered, userAnswer);
  }
  let html = '<div class="quiz-q" id="qq-' + phaseId + '-' + idx + '">'
    + '<div class="quiz-q-num">Pregunta ' + (idx + 1) + ' de 5</div>'
    + '<div class="quiz-q-text">' + q.q + '</div>';

  if (q.type === 'error' && q.output) {
    html += '<div class="quiz-output-box">' + q.output.replace(/\n/g, '<br>') + '</div>';
  }

  html += '<div class="quiz-options">';
  q.options.forEach(function(opt, oi) {
    let cls = 'quiz-opt';
    if (answered) {
      if (oi === q.correct) cls += ' correct';
      else if (oi === userAnswer && oi !== q.correct) cls += ' wrong';
      else cls += ' disabled';
    }
    html += '<div class="' + cls + '" onclick="' + (answered ? '' : 'answerQuestion(\'' + phaseId + '\',' + idx + ',' + oi + ')') + '">'
      + '<div class="quiz-opt-letter">' + String.fromCharCode(65 + oi) + '</div>'
      + '<div class="quiz-opt-text">' + opt + '</div>'
      + '</div>';
  });
  html += '</div>';

  if (answered) {
    html += '<div class="quiz-explanation ' + (userAnswer === q.correct ? 'correct-exp' : 'wrong-exp') + '">'
      + (userAnswer === q.correct ? '✓ Correcto — ' : '✗ Incorrecto — ')
      + q.explanation + '</div>';
  }
  html += '</div>';
  return html;
}

function renderReflection(phaseId, q, idx, answered, userAnswer) {
  const savedText = userAnswer || '';
  const promptForClaude = q.evalPrompt.replace('[RESPUESTA_USUARIO]', savedText || '[escribe tu respuesta arriba]');
  const encoded = encodeURIComponent(promptForClaude);
  const claudeUrl = 'https://claude.ai/new';

  return '<div class="quiz-q quiz-reflection" id="qq-' + phaseId + '-' + idx + '">'
    + '<div class="quiz-q-num">Pregunta 5 de 5 · Reflexión abierta</div>'
    + '<div class="quiz-reflection-badge">✦ Esta pregunta no tiene respuesta correcta única — Claude evaluará tu razonamiento</div>'
    + '<div class="quiz-q-text">' + q.q + '</div>'
    + '<textarea class="quiz-textarea" id="qt-' + phaseId + '-' + idx + '" placeholder="Escribe tu respuesta aquí (mínimo 3-4 líneas para que Claude pueda evaluarla bien)..." onchange="saveReflection(\'' + phaseId + '\',' + idx + ',this.value)">' + savedText + '</textarea>'
    + '<div class="quiz-reflection-actions">'
    + '<button class="quiz-eval-btn" onclick="evalReflection(\'' + phaseId + '\',' + idx + ')">'
    + '↗ Copiar prompt de evaluación y abrir Claude'
    + '</button>'
    + '<div class="quiz-eval-note">Claude leerá tu respuesta y te dará feedback como un tutor de PE</div>'
    + '</div>'
    + (answered ? '<div class="quiz-reflection-done">✓ Marcado como completado</div>' : '')
    + '<label class="quiz-mark-reflection">'
    + '<input type="checkbox" ' + (answered ? 'checked' : '') + ' onchange="markReflection(\'' + phaseId + '\',' + idx + ',this.checked)"> '
    + 'He recibido el feedback de Claude y estoy satisfecho con mi aprendizaje'
    + '</label>'
    + '</div>';
}

function toggleQuiz(phaseId) {
  const body = document.getElementById('quiz-body-' + phaseId);
  const btn = document.getElementById('quiz-toggle-' + phaseId);
  if (!body) return;
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'block';
  if (btn) btn.textContent = isOpen ? 'Comenzar →' : 'Cerrar ↑';
}

function answerQuestion(phaseId, qIdx, optIdx) {
  var state = getQuizState(phaseId) || { answers: {}, completed: false, score: 0 };
  if (state.answers[qIdx] !== undefined) return;
  state.answers[qIdx] = optIdx;
  saveQuizState(phaseId, state);
  // Re-render just this question
  var quiz = QUIZZES[phaseId];
  var q = quiz.questions[qIdx];
  var el = document.getElementById('qq-' + phaseId + '-' + qIdx);
  if (el) el.outerHTML = renderQuestion(phaseId, q, qIdx, true, optIdx);
}

function saveReflection(phaseId, qIdx, text) {
  var state = getQuizState(phaseId) || { answers: {}, completed: false, score: 0 };
  // Save text but don't mark as answered yet
  if (!state.reflectionTexts) state.reflectionTexts = {};
  state.reflectionTexts[qIdx] = text;
  saveQuizState(phaseId, state);
}

function markReflection(phaseId, qIdx, checked) {
  var state = getQuizState(phaseId) || { answers: {}, completed: false, score: 0 };
  if (checked) {
    state.answers[qIdx] = 'reflection_done';
  } else {
    delete state.answers[qIdx];
  }
  saveQuizState(phaseId, state);
}

function evalReflection(phaseId, qIdx) {
  var quiz = QUIZZES[phaseId];
  var q = quiz.questions[qIdx];
  var textarea = document.getElementById('qt-' + phaseId + '-' + qIdx);
  var userText = textarea ? textarea.value.trim() : '';
  if (!userText || userText.length < 20) {
    toast('Escribe tu respuesta antes de evaluarla', 'error');
    return;
  }
  // Save the reflection text
  saveReflection(phaseId, qIdx, userText);
  // Build the evaluation prompt with the user's answer
  var evalPrompt = q.evalPrompt.replace('[RESPUESTA_USUARIO]', userText);
  // Copy to clipboard
  navigator.clipboard.writeText(evalPrompt).then(function() {
    toast('Prompt copiado — abriendo Claude...', 'success');
    setTimeout(function() { window.open('https://claude.ai/new', '_blank'); }, 600);
  }).catch(function() {
    // If clipboard fails, just open Claude
    window.open('https://claude.ai/new', '_blank');
    toast('Pega el prompt en Claude manualmente', 'error');
  });
}

function submitQuiz(phaseId) {
  var state = getQuizState(phaseId) || { answers: {}, completed: false, score: 0 };
  var quiz = QUIZZES[phaseId];
  // Check if all MC questions answered
  var mcQuestions = quiz.questions.filter(function(q) { return q.type !== 'reflection'; });
  var allAnswered = mcQuestions.every(function(q, i) {
    var actualIdx = quiz.questions.indexOf(q);
    return state.answers[actualIdx] !== undefined;
  });
  if (!allAnswered) {
    toast('Responde todas las preguntas antes de ver los resultados', 'error');
    return;
  }
  // Calculate score
  var score = 0;
  quiz.questions.forEach(function(q, i) {
    if (q.type !== 'reflection' && state.answers[i] === q.correct) score++;
  });
  state.score = score;
  state.completed = true;
  saveQuizState(phaseId, state);
  // Update badge check
  var prevEarned = getEarnedBadges();
  checkBadges(prevEarned);
  // Re-render quiz section
  var quizEl = document.getElementById('quiz-' + phaseId);
  if (quizEl) quizEl.outerHTML = renderQuizSection(phaseId);
  // Re-open the body
  toggleQuiz(phaseId);
  // Show result toast
  var pct = Math.round(score / mcQuestions.length * 100);
  if (pct >= 80) toast('🎯 ' + score + '/' + mcQuestions.length + ' correctas — excelente', 'success');
  else if (pct >= 60) toast('📚 ' + score + '/' + mcQuestions.length + ' correctas — repasa las explicaciones', 'success');
  else toast('💪 ' + score + '/' + mcQuestions.length + ' — revisa la fase antes de continuar', 'error');
}

function getUserDocs() {

function saveUserDoc(doc) {
  var docs = getUserDocs();
  if (!docs.find(function(d){return d.id===doc.id;})) { docs.unshift(doc); if(docs.length>20) docs.splice(20); }
  localStorage.setItem('udocs', JSON.stringify(docs));
}
function getPhaseDoc(pid) {
  try { return JSON.parse(localStorage.getItem('pdoc_'+pid)||'null'); } catch(e) { return null; }
}
function setPhaseDoc(pid, doc) { localStorage.setItem('pdoc_'+pid, JSON.stringify(doc)); }
function detectDocType(name) {
  var n = name.toLowerCase();
  if(n.includes('cim')||n.includes('memorandum')) return 'CIM';
  if(n.includes('teaser')) return 'Teaser';
  if(n.includes('comit')||n.includes('board')) return 'Comité';
  if(n.includes('financ')||n.includes('p&l')) return 'P&L';
  return 'Documento';
}
function getDocName(pid) {
  var doc = getPhaseDoc(pid);
  if(!doc) return null;
  if(doc.id==='case_luda') return 'Luda Partners';
  if(doc.id==='case_medsoft') return 'MedSoft Solutions';
  if(doc.id==='case_tmi') return 'Técnicas Metálicas';
  return doc.name.split('—')[0].trim();
}
function getDocLabel(pid) {
  var doc = getPhaseDoc(pid);
  if(!doc) return '[selecciona un documento arriba]';
  if(doc.id==='case_luda') return 'el comité de Luda de mayo 2026 (adjunto)';
  if(doc.id==='case_medsoft') return 'el CIM de MedSoft Solutions (banco de casos)';
  if(doc.id==='case_tmi') return 'el P&L de Técnicas Metálicas (banco de casos)';
  return '"'+doc.name+'" ('+doc.type+')';
}
function personalizeText(text, pid) {
  if(!text) return text;
  var label = getDocLabel(pid);
  var name = getDocName(pid) || '[EMPRESA]';
  return text
    .replace(/__DOC__/g, label)
    .replace(/__EMPRESA__/g, name)
    .replace(/el comité de Luda adjunto/g, label)
    .replace(/el documento adjunto/g, label)
    .replace(/Luda Partners/g, name)
    .replace(/\[EMPRESA\]/g, name);
}

  var total = all.length;
  document.getElementById('prog-txt').textContent = done+' / '+total;
  document.getElementById('prog-fill').style.width = (total>0?done/total*100:0).toFixed(1)+'%';
}

// ═══════════════════════════════════════════════
// RENDER PHASE
// ═══════════════════════════════════════════════
function renderPhase(idx) {
  currentPhaseIdx = idx;
  currentView = 'course';
  renderNav();
  var p = PHASES[idx];
  var done = p.skills.filter(function(s){return progress[s.id];}).length;
  var html = renderDocPicker(p.id, p.docHint)
    + '<div class="phase-hdr">'
    + '<span class="phase-tag" style="background:'+p.colorDim+';color:'+p.color+'">'+p.label+'</span>'
    + '<h1>'+p.title+'</h1>'
    + '<p>'+p.subtitle+'</p>'
    + '<div class="phase-stats">'
    + '<div class="phase-stat"><strong>'+done+' / '+p.skills.length+'</strong> habilidades completadas</div>'
    + '</div></div>'
    + p.skills.map(function(s){return renderSkill(s, p);}).join('')
    + (typeof renderQuizSection === 'function' ? (renderQuizSection(p.id)||'') : '');
  document.getElementById('main').innerHTML = html;
  window.scrollTo(0,0);
}

function renderSkill(s, p) {
  var isDone = !!progress[s.id];
  var pid = p.id;

  var conceptHtml = s.concept.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  var diagramHtml = s.diagram ? '<div class="diagram-wrap">'+s.diagram+'</div>' : '';

  // Dynamics
  var dynamicsHtml = '';
  if(typeof renderBeforeAfter === 'function') dynamicsHtml += (renderBeforeAfter(s.id)||'');
  if(typeof renderScaffolding === 'function') dynamicsHtml += (renderScaffolding(s.id)||'');
  if(typeof renderFindTheError === 'function') dynamicsHtml += (renderFindTheError(s.id)||'');

  var tryHtml = '<div class="try-box">'
    + '<div class="try-label">✏ Tu turno primero</div>'
    + '<div class="try-q">'+s.tryPrompt+'</div>'
    + '<textarea class="try-textarea" id="try-'+s.id+'" placeholder="Escribe tu prompt aquí antes de ver la referencia..." onchange="saveTry(\''+s.id+'\',this.value)">'+getTry(s.id)+'</textarea>'
    + '<div class="try-actions">'
    + '<button class="show-ref-btn" onclick="showRef(\''+s.id+'\')">Ver prompt de referencia →</button>'
    + '<span class="try-hint">Escribe tu intento primero — el aprendizaje está en el gap</span>'
    + '</div></div>';

  var refHtml = '<div class="ref-box" id="ref-'+s.id+'">'
    + '<div class="ref-label">✦ Prompt de referencia</div>'
    + '<div class="ref-prompt" id="refp-'+s.id+'">'+escHtml(personalizeText(s.refPrompt, pid))
    + '<button class="copy-ref" onclick="copyRef(\''+s.id+'\')">Copiar</button></div>'
    + '<div class="gap-box"><div class="gap-label">El gap clave</div><div class="gap-text">'+s.gap+'</div></div>'
    + '<div style="margin-top:10px;display:flex;gap:8px;">'
    + '<a class="open-claude-btn" href="https://claude.ai/new" target="_blank">↗ Abrir en Claude con tu prompt</a>'
    + '</div>'
    + '</div>';

  return '<div class="skill-card'+(isDone?' done':'')+'" id="sc-'+s.id+'">'
    + '<div class="skill-hdr" onclick="toggleSkill(\''+s.id+'\')">'
    + '<div class="skill-check"><svg width="10" height="10" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
    + '<div class="skill-title">'+s.title+'</div>'
    + '<svg class="skill-chevron" width="14" height="14" viewBox="0 0 14 14" fill="none"><polyline points="3,5 7,9 11,5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    + '</div>'
    + '<div class="skill-body">'
    + '<div class="skill-section"><div class="skill-section-label">Concepto</div><div class="concept-text">'+conceptHtml+'</div>'+diagramHtml+'</div>'
    + (dynamicsHtml ? '<div class="skill-section"><div class="skill-section-label">Aprende viendo</div>'+dynamicsHtml+'</div>' : '')
    + '<div class="skill-section"><div class="skill-section-label">Practica</div>'+tryHtml+refHtml+'</div>'
    + '<div class="skill-section"><button class="mark-done-btn" onclick="toggleDone(\''+s.id+'\',\''+pid+'\')">'+(isDone?'✓ Completada — clic para reabrir':'✓ Marcar como completada')+'</button></div>'
    + '</div></div>';
}

function toggleSkill(id) {
  var card = document.getElementById('sc-'+id);
  if(card) card.classList.toggle('open');
}

async function toggleDone(skillId, pid) {
  progress[skillId] = !progress[skillId];
  await saveSkill(skillId, progress[skillId]);
  var card = document.getElementById('sc-'+skillId);
  if(card) {
    card.classList.toggle('done', progress[skillId]);
    var btn = card.querySelector('.mark-done-btn');
    if(btn) btn.textContent = progress[skillId]?'✓ Completada — clic para reabrir':'✓ Marcar como completada';
    var title = card.querySelector('.skill-title');
    if(title) title.style.textDecoration = progress[skillId]?'line-through':'';
  }
  renderNav();
  renderWeekly();
  if(progress[skillId]) { recordActivity(); renderStreak(); checkBadges(); toast('Habilidad completada 🎯', 'success'); }
}

// Try/ref state
function getTry(id) { return localStorage.getItem('try_'+id)||''; }
function saveTry(id, val) { localStorage.setItem('try_'+id, val); }
function showRef(id) {
  var ref = document.getElementById('ref-'+id);
  if(ref) { ref.classList.add('visible'); }
}
function copyRef(id) {
  var el = document.getElementById('refp-'+id);
  if(!el) return;
  var text = el.innerText.replace('Copiar','').trim();
  navigator.clipboard.writeText(text).then(function(){ toast('Prompt copiado', 'success'); });
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════════════════════════════════════
// LIBRARY
// ═══════════════════════════════════════════════
function showView(view) {
  currentView = view;
  renderNav();
  if(view==='library') renderLibrary();
  else if(view==='leaderboard') showLeaderboard();
}

function renderLibrary() {
  var html = '<div class="phase-hdr">'
    + '<h1 style="font-family:var(--font-display)">📚 Biblioteca de prompts</h1>'
    + '<p style="color:var(--text2);font-size:14px;margin-top:6px;">Referencia rápida. Busca, copia y usa en Claude.ai.</p>'
    + '</div>'
    + '<input class="lib-search" placeholder="Buscar: comité, CIM, red team, LBO..." oninput="filterLib(this.value)" id="lib-search"/>'
    + '<div id="lib-content">'
    + renderLibContent(LIBRARY)
    + '</div>';
  document.getElementById('main').innerHTML = html;
  window.scrollTo(0,0);
}

function renderLibContent(items) {
  return items.map(function(cat) {
    return '<div class="lib-category" data-cat="'+cat.category+'">'
      + '<div class="lib-cat-label">'+cat.category+'</div>'
      + cat.items.map(function(item) {
        return '<div class="lib-item" id="li-'+item.id+'">'
          + '<div class="lib-item-hdr" onclick="toggleLib(\''+item.id+'\')">'
          + '<div class="lib-item-title">'+item.title+'</div>'
          + '<div class="lib-tags">'+item.tags.map(function(t){return '<span class="lib-tag">'+t+'</span>';}).join('')+'</div>'
          + '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0;color:var(--text3)"><polyline points="3,5 7,9 11,5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
          + '</div>'
          + '<div class="lib-item-body">'
          + '<div class="lib-prompt-box">'+escHtml(item.prompt)+'<button class="copy-ref" onclick="copyLib(\''+item.id+'\')">Copiar</button></div>'
          + '<div style="margin-top:8px;"><a class="open-claude-btn" href="https://claude.ai/new" target="_blank">↗ Abrir en Claude</a></div>'
          + '</div></div>';
      }).join('')
      + '</div>';
  }).join('');
}

function toggleLib(id) {
  var el = document.getElementById('li-'+id);
  if(el) { el.classList.toggle('open'); if(el.classList.contains('open')){ var n=parseInt(localStorage.getItem('lib_opens')||'0')+1; localStorage.setItem('lib_opens',n); checkBadges(); } }
}

function copyLib(id) {
  var item = LIBRARY.flatMap(function(c){return c.items;}).find(function(i){return i.id===id;});
  if(item) { navigator.clipboard.writeText(item.prompt).then(function(){ toast('Prompt copiado', 'success'); }); }
}

function filterLib(q) {
  var lq = q.toLowerCase();
  document.querySelectorAll('.lib-item').forEach(function(el) {
    var text = el.textContent.toLowerCase();
    el.style.display = (!q || text.includes(lq)) ? '' : 'none';
  });
  document.querySelectorAll('.lib-category').forEach(function(el) {
    var visible = Array.from(el.querySelectorAll('.lib-item')).some(function(i){ return i.style.display!=='none'; });
    el.style.display = visible ? '' : 'none';
  });
}

// ═══════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════
function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast '+(type||'')+' show';
  setTimeout(function(){ el.classList.remove('show'); }, 2800);
}

// ═══════════════════════════════════════════════
// APP INIT
// ═══════════════════════════════════════════════
function showApp() {
  var authEl = document.getElementById('auth-screen');
  if(authEl) { authEl.classList.add('hidden'); authEl.style.display='none'; }
  var appEl = document.getElementById('app');
  if(appEl) { appEl.classList.remove('hidden'); appEl.style.display='flex'; }
  var name = (currentUser.user_metadata && currentUser.user_metadata.full_name) || currentUser.email.split('@')[0] || '?';
  var initials = name.split(' ').map(function(n){return n[0];}).join('').slice(0,2).toUpperCase();
  document.getElementById('sb-avatar').textContent = initials;
  document.getElementById('sb-name').textContent = name;
  renderNav();
  renderPhase(0);
  initTheme();
  recordActivity();
  renderStreak();
  renderWeekly();
}

window.addEventListener('load', async function() {
  initTheme();
  initSB();
  var loading = document.getElementById('loading');
  try {
    var res = await sbClient.auth.getSession();
    if(res.data && res.data.session && res.data.session.user) {
      currentUser = res.data.session.user;
      await loadProgress();
      loading.style.opacity = '0';
      setTimeout(function(){ loading.style.display='none'; }, 300);
      showApp();
    } else {
      loading.style.opacity = '0';
      setTimeout(function(){ loading.style.display='none'; }, 300);
      document.getElementById('auth-screen').classList.remove('hidden');
    }
  } catch(e) {
    loading.style.opacity = '0';
    setTimeout(function(){ loading.style.display='none'; }, 300);
    document.getElementById('auth-screen').classList.remove('hidden');
  }
});
</script>
</body>
</html>
